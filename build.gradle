plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

loom {
    runs {
        // The mod is server-side only, but it also works on a logical server inside a client
        // (single player / LAN), which is why fabric.mod.json declares environment "*".
        server {
            server()
            programArgs '--nogui'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // No mappings line: Minecraft 26.x ships unobfuscated, so the Mojang names are the real ones.

    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // NightConfig backs dev.tourmi.svmm.config.spec, the stand-in for ForgeConfigSpec.
    // Forge bundles it; Fabric does not, so it is jar-in-jar'd.
    implementation include("com.electronwill.night-config:core:${nightconfig_version}")
    implementation include("com.electronwill.night-config:toml:${nightconfig_version}")
}

tasks.named('processResources', ProcessResources) {
    def properties = [
            mod_id           : mod_id,
            version          : version,
            mod_version      : mod_version,
            mod_group        : mod_group,
            mod_name         : mod_name,
            mod_description  : mod_description,
            mod_authors      : mod_authors,
            mod_credits      : mod_credits,
            mod_issue_tracker: mod_issue_tracker,
            mod_url          : mod_url,
            mod_sources      : mod_sources,
            mod_license      : mod_license,

            author_name      : author_name,
            author_domain    : author_domain,

            minecraft_version: minecraft_version,
            loader_version   : loader_version,
            java_version     : java_version
    ]

    inputs.properties properties

    filesMatching('fabric.mod.json') {
        expand properties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

tasks.named('jar', Jar) {
    // GPLv3 section 4: every copy conveyed ships the license text.
    from('LICENSE') {
        rename { "${it}_${mod_id}" }
    }

    manifest {
        attributes([
                "Specification-Title"     : mod_name,
                "Specification-Vendor"    : author_name,
                "Specification-Version"   : mod_version,
                "Implementation-Title"    : mod_name,
                "Implementation-Vendor"   : author_name,
                "Implementation-Version"  : mod_version,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
